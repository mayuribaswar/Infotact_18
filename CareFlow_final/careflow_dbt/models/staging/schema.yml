version: 2

models:
  - name: stg_hospital_events
    description: "Cleaned, cast, and filtered raw hospital log data imported from BigQuery."
    columns:
      - name: event_id
        description: "Primary key for the raw event record."
        tests:
          - unique
          - not_null
      - name: case_id
        description: "Unique hospital visit or admission record identifier."
        tests:
          - not_null
      - name: patient_id
        description: "Patient identifier from source system."
        tests:
          - not_null
      - name: department
        description: "Normalized clinical department name."
      - name: activity_name
        description: "Name of the medical or administrative task completed."
      - name: transition_start_time
        description: "UTC timestamp when the activity started."
      - name: transition_end_time
        description: "UTC timestamp when the activity ended."