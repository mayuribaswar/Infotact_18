version: 2

models:
  - name: int_activity_transitions
    description: "Calculates step-to-step paths and lead-time deltas using window functions."
    columns:
      - name: event_id
        description: "Foreign key referencing the current event."
      - name: next_activity
        description: "Subsequent activity determined via lead() analytical function."
      - name: wait_duration_minutes
        description: "Calculated lag duration between the current event end and the next event start."

  - name: int_ordered_events
    description: "Orders clinical events chronologically by case_id and timestamp."
    columns:
      - name: case_id
        description: "Encounter tracking identifier."
      - name: event_order_seq
        description: "Integer sequence index (1, 2, 3...) of activities within a case."

  - name: int_normalized_events
    description: "Standardizes department names, activity nomenclature, and event timestamps."

  - name: int_patient_journeys
    description: "Intermediate rollup calculating total encounter durations and visit completion flags."

  - name: int_process_bottlenecks
    description: "Pre-aggregated operational bottleneck metrics grouping wait intervals by path and department."