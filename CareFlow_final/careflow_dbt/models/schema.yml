version: 2

models:

  - name: int_process_bottlenecks
    description: >
      Aggregates patient activity transitions and calculates
      transition-time metrics for process bottleneck analysis.

    columns:

      - name: activity_from
        description: "Starting activity in the patient process."
        tests:
          - not_null

      - name: activity_to
        description: "Next activity in the patient process."
        tests:
          - not_null

      - name: transition_count
        description: "Number of occurrences of the transition."
        tests:
          - not_null

      - name: patient_count
        description: "Number of unique patient cases using the transition."
        tests:
          - not_null

      - name: avg_transition_time_minutes
        description: "Average time between the two activities."
        tests:
          - not_null


  - name: fct_process_bottlenecks
    description: >
      Process bottleneck mart containing transition frequency,
      waiting-time metrics and bottleneck classification.

    columns:

      - name: activity_from
        description: "Starting activity."
        tests:
          - not_null

      - name: activity_to
        description: "Ending activity."
        tests:
          - not_null

      - name: transition_count
        description: "Total transition occurrences."
        tests:
          - not_null

      - name: patient_count
        description: "Number of unique patient cases."
        tests:
          - not_null

      - name: bottleneck_level
        description: "Bottleneck severity classification."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Low
                  - Medium
                  - High

      - name: bottleneck_score
        description: "Numeric bottleneck score."
        tests:
          - not_null
      - name: int_patient_journey

    description: >
      Patient-level intermediate model summarizing the complete
      patient journey from first event to last event.

    columns:

      - name: Patient_ID
        description: "Unique patient identifier."
        tests:
          - not_null

      - name: first_activity
        description: "First recorded activity for the patient."
        tests:
          - not_null

      - name: last_activity
        description: "Last recorded activity for the patient."
        tests:
          - not_null

      - name: first_event_timestamp
        description: "Timestamp of the first patient event."
        tests:
          - not_null

      - name: last_event_timestamp
        description: "Timestamp of the last patient event."
        tests:
          - not_null

      - name: total_activities
        description: "Total number of activities recorded for the patient."
        tests:
          - not_null

      - name: total_process_time_minutes
        description: "Total elapsed time of the patient journey in minutes."
        tests:
          - not_null


  - name: fct_patient_journey

    description: >
      Patient journey MART containing patient-level process duration,
      waiting-time metrics and performance classification.

    columns:

      - name: Patient_ID
        description: "Unique patient identifier."
        tests:
          - not_null

      - name: total_process_time_minutes
        description: "Total elapsed patient journey time in minutes."
        tests:
          - not_null

      - name: total_wait_time_minutes
        description: "Total waiting time for the patient."
        tests:
          - not_null

      - name: process_performance
        description: "Patient journey performance classification."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Fast
                  - Moderate
                  - Slow

      - name: performance_score
        description: "Numeric performance score."
        tests:
          - not_null